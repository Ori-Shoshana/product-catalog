version: '3.9'

services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catalog
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d catalog']
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    image: service-name:local
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: production
      SERVER_PORT: 8080

      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: catalog

    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
